name: selftest

on:
  push:
  pull_request:
  # 手动跑一次（工具改完想立刻验，不用专门推个空提交）
  workflow_dispatch:

jobs:
  motion-qc:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest 的 runner 镜像自带 Chrome；两个桌面系统用官方 action 拉。
      - name: 拉 Chrome（macOS）
        if: runner.os == 'macOS'
        run: brew install --cask google-chrome

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
        if: runner.os != 'Linux'

      - run: pip install -e .

      # 样本报错就红：这层就是拿来证明判定口径没被改坏的。
      - name: 好样本必须全绿
        run: motion-qc check samples/good/ -v

      # 坏样本必须被拦下。预期退出码 1，所以先看输出再判退出码——
      # 直接跑会红，那正是我们要的，但要先确认红的原因是「拦下了」而不是「崩了」。
      #
      # ⚠️ 必须显式 shell: bash。windows-latest 的默认 shell 是 pwsh，
      #    下面这段 set +e / if [ ... ] 是 bash 语法，在 pwsh 里直接 ParserError
      #    （Missing '(' after 'if'），整条 run 判红 —— 但红的不是「样本没被拦下」，
      #    是「脚本压根没跑起来」。这类假红最坏：它让人以为工具坏了。
      - name: 坏样本必须被拦下
        shell: bash
        run: |
          set +e
          motion-qc check samples/bad/ -v
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::坏样本的预期退出码是 1（有不合格项），实际是 $rc"
            exit 1
          fi

      - name: 好样本 JSON 必须 ok=true
        shell: bash
        run: |
          motion-qc check samples/good/ -q --json good.json
          python -c "
          import json,sys
          d=json.load(open('good.json',encoding='utf-8'))
          assert d['summary']['ok'], d['summary']
          print('好样本全过：', d['summary'])
          "

      - name: 工具自测
        run: motion-qc selftest

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>已知好样本 · 宽版构图（1920×1080）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0D0C; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

  .wash   { position: absolute; left: 0;    top: 0;    width: 1920px; height: 1080px;
            background: radial-gradient(60% 50% at 30% 40%, rgba(0,255,170,.10), rgba(0,0,0,0) 70%); }
  .idx    { position: absolute; left: 160px; top: 120px; font-size: 26px; letter-spacing: .22em; color: #4ADE80; }
  .title  { position: absolute; left: 160px; top: 380px; width: 1300px; height: 190px;
            font-size: 168px; line-height: 1.0; color: #F4EFE7; }
  .lede   { position: absolute; left: 160px; top: 640px; width: 820px; height: 96px;
            font-size: 34px; line-height: 1.45; color: rgba(244,239,231,.60); }
  .tally  { position: absolute; left: 1500px; top: 380px; width: 260px; height: 260px;
            border: 2px solid rgba(74,222,128,.55); border-radius: 20px; }
  .tally-n{ position: absolute; left: 1560px; top: 460px; width: 140px; height: 90px;
            font-size: 78px; color: #4ADE80; }
  .foot   { position: absolute; left: 160px; top: 920px; width: 1600px; height: 40px;
            font-size: 28px; color: rgba(244,239,231,.45); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-duration="4">
  <div class="wash"></div>
  <div class="idx">CHAPTER 01</div>
  <h1 class="title">稀缺</h1>
  <p class="lede">真正稀缺的不是答案，是把问题问对的那几分钟。</p>
  <div class="tally"></div>
  <div class="tally-n">26</div>
  <div class="foot">DRAFT — NOT FOR DISTRIBUTION</div>
</div>
<script>
window.__timelines = { main: (function () {
  var tracks = [], dur = 0;
  return {
    add: function (start, len, apply) {
      tracks.push({ s: start, d: len, f: apply });
      if (start + len > dur) dur = start + len;
    },
    duration: function () { return dur; },
    time: function (t) {
      for (var i = 0; i < tracks.length; i++) {
        var k = tracks[i];
        var p = k.d <= 0 ? 1 : Math.min(1, Math.max(0, (t - k.s) / k.d));
        k.f(p);
      }
    },
  };
})() };

(function () {
  var tl = window.__timelines.main;
  function q(sel) { return document.querySelector(sel); }
  function rise(sel, start, len, dy) {
    var el = q(sel);
    tl.add(start, len, function (p) {
      el.style.opacity = p;
      el.style.transform = 'translateY(' + ((1 - p) * dy).toFixed(2) + 'px)';
    });
  }
  rise('.idx', 0.1, 0.6, 10);
  rise('.title', 0.3, 0.9, 40);
  rise('.lede', 0.8, 0.8, 24);
  var box = q('.tally'), num = q('.tally-n');
  tl.add(0.5, 1.0, function (p) {
    box.style.transform = 'scale(' + (0.86 + 0.14 * p).toFixed(3) + ')';
    box.style.opacity = p;
  });
  tl.add(0.9, 0.7, function (p) {
    num.style.opacity = p;
    num.style.transform = 'translateY(' + ((1 - p) * 18).toFixed(2) + 'px)';
  });
  rise('.foot', 1.4, 0.7, 12);
  q('.wash').style.opacity = '0';
  tl.add(0.0, 1.2, function (p) { q('.wash').style.opacity = p; });
  tl.time(0);
})();
</script>
</body>
</html>

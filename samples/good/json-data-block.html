<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=480, height=270" />
<title>已知好样本 · 带 JSON 变量自描述块的外部图层</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .plate { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #0E1311; }
  .head  { position: absolute; left: 24px; top: 100px; width: 400px; height: 40px;
           font-size: 26px; color: #F4EFE7; }
  .sub   { position: absolute; left: 24px; top: 150px; width: 380px; height: 20px;
           font-size: 13px; color: rgba(244,239,231,.6); }
</style>
</head>
<body>
<div id="stage">
  <div class="plate"></div>
  <div class="head">2026 年度复盘</div>
  <div class="sub">变量自描述块必须被当成数据，不能当 JS</div>
</div>

<!-- compose/2 外部图层的标准写法：把可编排变量声明成一个 JSON 数据块。
     这是数据，不是 JavaScript。第一版品控工具把它抽出来丢给 node --check，
     于是**每一个**这么写的合法外部图层都被判成语法错。 -->
<script type="application/json" data-hyperframes-variables>
{
  "headline": { "type": "string", "label": "主标题", "default": "2026 年度复盘" },
  "accent":   { "type": "color",  "label": "强调色", "default": "#4ADE80" },
  "duration": { "type": "number", "label": "时长（秒）", "default": 2.2 }
}
</script>

<!-- 结构化数据同理，也是数据块 -->
<script type="application/ld+json">
{ "@context": "https://schema.org", "@type": "VideoObject" }
</script>

<!-- 模块映射：浏览器用的，不是 JS -->
<script type="importmap">
{ "imports": { "gsap": "./gsap.min.js" } }
</script>

<script src="./_does-not-exist.js"></script>
<script>
  var vars = JSON.parse(document.querySelector('script[type="application/json"]').textContent);
  document.querySelector('.head').textContent = vars.headline.default;
  window.__timelines = { main: (function () {
    var tracks = [], dur = 0;
    return {
      add: function (start, len, apply) {
        tracks.push({ s: start, d: len, f: apply });
        if (start + len > dur) dur = start + len;
      },
      duration: function () { return dur; },
      time: function (t) {
        for (var i = 0; i < tracks.length; i++) {
          var k = tracks[i];
          var p = k.d <= 0 ? 1 : Math.min(1, Math.max(0, (t - k.s) / k.d));
          k.f(p);
        }
      },
    };
  })() };
  (function () {
    var tl = window.__timelines.main;
    ['.head', '.sub'].forEach(function (sel, i) {
      var el = document.querySelector(sel);
      el.style.opacity = '0';
      tl.add(0.1 + i * 0.2, 0.6, function (p) {
        el.style.opacity = p;
        el.style.transform = 'translateY(' + ((1 - p) * 10).toFixed(2) + 'px)';
      });
    });
    tl.add(1.6, 0.001, function () {});
    tl.time(0);
  })();
</script>
</body>
</html>

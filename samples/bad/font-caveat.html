<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=480, height=270" />
<title>已知坏样本 · 文字出框 + 字体取不到（结论要打折）</title>
<style>
  @font-face {
    font-family: 'SampleMissing';
    src: url('./_no-such-font-file.ttf') format('truetype');
    font-weight: 400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .plate { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #0E1311; }
  /* 右边越界 6px。字体取不到时，这几个像素是兜底字体的字宽差出来的，
     换成本机装着的字体可能刚好在框内——所以这条结论必须附带「字体没到位」的提示，
     而不是让人照着 6px 去改布局。 */
  .head  { position: absolute; left: 24px; top: 100px; width: 458px; height: 50px;
           font-family: 'SampleMissing', sans-serif; font-size: 30px; color: #F4EFE7;
           white-space: nowrap; }
  .label { position: absolute; left: 24px; top: 24px; font-size: 12px; color: #F4EFE7; }
</style>
</head>
<body>
<div id="stage">
  <div class="plate"></div>
  <div class="label">字体 + 出框样本</div>
  <div class="head">这一行比画布宽，量到的宽度取决于字体</div>
</div>
<script>
window.__timelines = { main: (function () {
  var tracks = [], dur = 0;
  return {
    add: function (start, len, apply) {
      tracks.push({ s: start, d: len, f: apply });
      if (start + len > dur) dur = start + len;
    },
    duration: function () { return dur; },
    time: function (t) {
      for (var i = 0; i < tracks.length; i++) {
        var k = tracks[i];
        var p = k.d <= 0 ? 1 : Math.min(1, Math.max(0, (t - k.s) / k.d));
        k.f(p);
      }
    },
  };
})() };
(function () {
  var tl = window.__timelines.main;
  var el = document.querySelector('.head');
  el.style.opacity = '0';
  tl.add(0.1, 0.6, function (p) {
    el.style.opacity = p;
    el.style.transform = 'translateX(' + ((1 - p) * 12).toFixed(2) + 'px)';
  });
  tl.add(1.5, 0.001, function () {});
  tl.time(0);
})();
</script>
</body>
</html>

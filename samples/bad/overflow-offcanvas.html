<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=480, height=270" />
<title>已知坏样本 · 落定后整块停在画布左侧之外</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .plate { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #0E1311; }
  /* left:-600，没有任何补间把它拉回来 → 落定后整块仍在画布外。
     注意 #stage 有 overflow:hidden，肉眼看到的只是「少了块东西」，
     DOM 读数完全正常——这类 bug 就是出框扫描存在的理由。 */
  .ghost { position: absolute; left: -600px; top: 40px; width: 240px; height: 180px; background: #FF6B35; }
  .label { position: absolute; left: 20px; top: 24px; font-size: 12px; color: #F4EFE7; }
</style>
</head>
<body>
<div id="stage">
  <div class="plate"></div>
  <div class="ghost"></div>
  <div class="label">整块出画样本</div>
</div>
<script>
window.__timelines = { main: (function () {
  var tracks = [], dur = 0;
  return {
    add: function (start, len, apply) {
      tracks.push({ s: start, d: len, f: apply });
      if (start + len > dur) dur = start + len;
    },
    duration: function () { return dur; },
    time: function (t) {
      for (var i = 0; i < tracks.length; i++) {
        var k = tracks[i];
        var p = k.d <= 0 ? 1 : Math.min(1, Math.max(0, (t - k.s) / k.d));
        k.f(p);
      }
    },
  };
})() };
(function () {
  var tl = window.__timelines.main;
  var el = document.querySelector('.ghost');
  el.style.opacity = '0';
  tl.add(0.2, 0.6, function (p) { el.style.opacity = p; });
  tl.add(1.6, 0.001, function () {});
  tl.time(0);
})();
</script>
</body>
</html>

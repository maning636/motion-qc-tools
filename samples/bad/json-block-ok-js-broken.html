<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=480, height=270" />
<title>已知坏样本 · JSON 块合法，但真正的 JS 块有语法错</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .plate { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #0E1311; }
</style>
</head>
<body>
<div id="stage"><div class="plate"></div></div>

<!-- 这一段是好的，不许报它。修白名单不是为了把真阳性一起修没。 -->
<script type="application/json" data-hyperframes-variables>
{
  "headline": { "type": "string", "label": "主标题", "default": "别把我当 JS" },
  "count":    { "type": "number", "label": "计数",   "default": 3 }
}
</script>

<!-- 这一段是坏的，必须报出来。
     注意这里不是「少个分号」——ASI 会把少分号补回来，那还是合法 JS。
     得是解析器真的过不去的那种错。 -->
<script>
  var v = { headline: "123", count: 3 };
  function broken( {
  window.__timelines = { main: null };
</script>
</body>
</html>

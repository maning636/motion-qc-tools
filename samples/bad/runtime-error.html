<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=480, height=270" />
<title>已知坏样本 · 运行期抛异常</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .plate { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #0E1311; }
  .label { position: absolute; left: 20px; top: 24px; font-size: 12px; color: #F4EFE7; }
</style>
</head>
<body>
<div id="stage">
  <div class="plate"></div>
  <div class="label">运行期异常样本</div>
</div>
<script>
window.__timelines = { main: (function () {
  var tracks = [], dur = 0;
  return {
    add: function (start, len, apply) {
      tracks.push({ s: start, d: len, f: apply });
      if (start + len > dur) dur = start + len;
    },
    duration: function () { return dur; },
    time: function (t) {
      for (var i = 0; i < tracks.length; i++) {
        var k = tracks[i];
        var p = k.d <= 0 ? 1 : Math.min(1, Math.max(0, (t - k.s) / k.d));
        k.f(p);
      }
    },
  };
})() };

/* 时间轴注册得好好的，然后抛了。异常报在**这个 iframe 自己的 window** 上，
   挂父页面听不见——所以探针必须把监听挂在组件文档内部。 */
(function () {
  window.__timelines.main.add(0.5, 0.001, function () {});
  window.__timelines.main.time(0);
  null.someMethod();
})();
</script>
</body>
</html>
